<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Music Overlay</title>
    <style>
        :root {
        --widget-scale: 1.0;
        --widget-width: 420px;
            --bg-color: #161b22;
            --bar-color: #ff4757;
            --opacity: 0.8;
            --brightness: 1;
            --transform-hidden: translateY(120px) scale(0.95);
            --transform-visible: translateY(0) scale(1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
        transform-origin: bottom left;
        transform: scale(var(--widget-scale));
        width: var(--widget-width);
        height: 100vh;
            background: transparent;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        .overlay {
        width: var(--widget-width);
        max-width: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            opacity: 0;
            filter: brightness(var(--brightness));
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: var(--transform-hidden);
            max-width: 420px;
        }

        .overlay.visible {
            opacity: 1;
            transform: var(--transform-visible);
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: var(--transform-hidden);
        }

        .art {
            position: relative;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* removed overflow: hidden to allow ambilight to bleed out */
        }

        .art::before {
            content: "";
            display: var(--ambilight-display, block);
            position: absolute;
            top: -30%; left: -30%; right: -30%; bottom: -30%;
            background-image: var(--ambilight-img, none);
            background-size: cover;
            background-position: center;
            /* ╨г╤Б╨╕╨╗╨╡╨╜╨╜╤Л╨╡, ╨╜╨╛ ╤В╨╛╤З╨╜╤Л╨╡ ╤Ж╨▓╨╡╤В╨░ ╤Б ╨▒╨╛╨╗╤М╤И╨╕╨╝ ╤А╨░╨╖╨╝╤Л╤В╨╕╨╡╨╝ */
            filter: blur(25px) saturate(2.5) brightness(1.2);
            opacity: 0.95;
            z-index: 0;
            border-radius: 50%; /* ╨Ъ╤А╤Г╨│╨╗╨░╤П ╤Д╨╛╤А╨╝╨░ ╨┤╨╗╤П ╨▒╨╡╤Б╤И╨╛╨▓╨╜╨╛╨│╨╛ ╨▓╤А╨░╤Й╨╡╨╜╨╕╤П */
            transition: background-image 0.5s ease;
            pointer-events: none;
            animation: haloSpin 10s linear infinite;
        }
        @keyframes haloSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .art img { 
            position: relative; 
            z-index: 2; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: opacity 0.3s; 
            border-radius: inherit; 
        }
        
        .art .placeholder { 
            position: relative; 
            z-index: 2; 
            font-size: 24px; 
            opacity: 0.2; 
        }

        .info { flex: 1; min-width: 0; }
        .title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
        .artist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

        .progress-track {
            width: 100%; height: 3px; background: rgba(255, 255, 255, 0.1);
            border-radius: 2px; margin-top: 8px; overflow: hidden;
        }
        .progress-bar {
            height: 100%; background: var(--bar-color);
            border-radius: 2px; transition: width 1.2s linear; width: 0%;
        }

        /* тФАтФАтФА AURA GLASS STYLE (UNIFIED) тФАтФАтФА */
        .overlay {
        width: var(--widget-width);
        max-width: none;
            /* Basic Aura Box */
            background: var(--bg-rgba, rgba(18, 18, 20, 0.4));
            backdrop-filter: blur(50px) saturate(200%);
            -webkit-backdrop-filter: blur(50px) saturate(200%);
            border-radius: var(--border-radius, 32px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 12px 28px 12px 12px;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .art { 
            width: 72px; 
            height: 72px; 
            border-radius: var(--border-radius, 24px); 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); 
            background: #111;
        }
        
        .title { font-size: 17px; color: #fff; font-weight: 700; letter-spacing: -0.2px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .artist { font-size: 13.5px; color: rgba(255, 255, 255, 0.75); margin-top: 2px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); font-weight: 500; }
        


        /* ANIMATIONS */
        .art img, .title, .artist {
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: scale(1);
        }

        .overlay.track-change .art img,
        .overlay.track-change .title,
        .overlay.track-change .artist {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
    
        /* Vinyl Record */
        .overlay.theme-vinyl {
            background: var(--bg-rgba);
            border-radius: var(--border-radius, 100px);
            padding: 12px 30px 12px 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .overlay.theme-vinyl::before { display: none; }
        .overlay.theme-vinyl .art {
            border-radius: 50%;
            border: 4px solid #111;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.1), inset 0 0 15px rgba(0,0,0,0.8);
            animation: spin 4s linear infinite;
        }
        .overlay.theme-vinyl .art::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 12px; height: 12px; background: #111; border-radius: 50%;
            transform: translate(-50%, -50%); border: 1px solid #333;
        }
        .overlay.theme-vinyl.paused .art { animation-play-state: paused; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Minimalist */
        .overlay.theme-minimal {
            background: var(--bg-rgba);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-radius: var(--border-radius, 0px);
            border-left: 4px solid var(--bar-color);
            padding: 10px 20px;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            display: flex; align-items: center;
        }
        .overlay.theme-minimal::before { display: none; }
        .overlay.theme-minimal .art {
            border-radius: 4px;
            width: 48px; height: 48px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Compact Pill */
        .overlay.theme-pill {
            background: var(--bg-rgba);
            border-radius: var(--border-radius, 50px);
            padding: 8px 20px 8px 8px;
            display: flex; align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .overlay.theme-pill::before { display: none; }
        .overlay.theme-pill .art { width: 36px; height: 36px; border-radius: 50%; }
        .overlay.theme-pill .title { font-size: 14px; margin-bottom: 2px; }
        .overlay.theme-pill .artist { font-size: 11px; }

    </style>
</head>
<body>
    <div class="overlay hidden" id="overlay">
        <div class="art" id="art"><div class="placeholder">ЁЯО╡</div></div>
        <div class="info">
            <div class="title" id="title"></div>
            <div class="artist" id="artist"></div>
        </div>
    </div>

    <script>
    (function() {
        const overlay = document.getElementById('overlay');
        const artEl = document.getElementById('art');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');

        let lastTrack = null; 
        let hideTimer = null;
        let lastTestTrigger = null;
        let itunesCache = {};
        let currentArtUrl = null;

        function formatTime(sec) {
            if (sec < 0) return "0:00";
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        async function getFallbackArt(title, artist) {
            if (!title) return null;
            let q = title;
            if (artist) q = artist + ' ' + title;
            if (itunesCache[q] !== undefined) return itunesCache[q];
            
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=1`);
                const json = await res.json();
                if (json.results && json.results.length > 0) {
                    let url = json.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                    itunesCache[q] = url;
                    return url;
                }
            } catch(e) {}
            itunesCache[q] = null;
            return null;
        }

        function applySettings(settings) {
            const root = document.documentElement;
            
            let bgHex = settings.bgColor || '#161b22';
            let opacity = (settings.opacity !== undefined ? settings.opacity : 80) / 100;
            bgHex = bgHex.replace('#', '');
            if (bgHex.length === 3) bgHex = bgHex.split('').map(x => x+x).join('');
            let r = parseInt(bgHex.substring(0,2), 16) || 22;
            let g = parseInt(bgHex.substring(2,4), 16) || 27;
            let b = parseInt(bgHex.substring(4,6), 16) || 34;
            
            root.style.setProperty('--bg-rgba', 
`rgba(${r}, ${g}, ${b}, ${opacity})`);
            
            root.style.setProperty('--bar-color', settings.barColor || '#ff4757');
            root.style.setProperty('--brightness', (settings.brightness ?? 100) / 100);

            // Dynamic settings
            if (settings.ambilight === false) {
                artEl.style.setProperty('--ambilight-display', 'none');
            } else {
                artEl.style.setProperty('--ambilight-display', 'block');
            }
            if (settings.borderRadius !== undefined) {
                root.style.setProperty('--border-radius', settings.borderRadius + 'px');
            } else {
                root.style.setProperty('--border-radius', '14px');
            }

            // Handle animation direction
            let hiddenTransform = 'translateY(120px) scale(0.95)';
            if (settings.animationDir === 'left') hiddenTransform = 'translateX(-300px) scale(0.95)';
            if (settings.animationDir === 'right') {
                overlay.style.left = 'auto';
                overlay.style.right = '24px';
                hiddenTransform = 'translateX(300px) scale(0.95)';
            } else {
                overlay.style.left = '24px';
                overlay.style.right = 'auto';
            }
            root.style.setProperty('--transform-hidden', hiddenTransform);
            
            // Test trigger
            if (settings._testTrigger && settings._testTrigger !== lastTestTrigger) {
                lastTestTrigger = settings._testTrigger;
                showTemporarily(settings.showDuration);
            }
        }

        function showTemporarily(duration) {
            overlay.classList.remove('hidden');
            overlay.classList.add('visible');
            clearTimeout(hideTimer);
            if (duration > 0) {
                hideTimer = setTimeout(() => {
                    overlay.classList.remove('visible');
                    overlay.classList.add('hidden');
                }, duration * 1000);
            }
        }

        let isAnimating = false;

        function applyDomData(data, trackKey, isPlaying, settings, trackChanged) {
            lastTrack = trackKey;
            
            if(settings) {
                if(settings.theme) {
                    overlay.classList.remove('theme-aura', 'theme-vinyl', 'theme-minimal', 'theme-pill');
                    if(settings.theme !== 'aura') {
                        overlay.classList.add('theme-' + settings.theme);
                    }
                }
                if(settings.scale !== undefined) {
                    document.documentElement.style.setProperty('--widget-scale', settings.scale);
                }
                if(settings.width !== undefined) {
                    document.documentElement.style.setProperty('--widget-width', settings.width + 'px');
                }
            }

            
            if (trackChanged) {
                // CLEAR OLD ART INSTANTLY
                artEl.innerHTML = '<div class="placeholder">ЁЯО╡</div>';
                artEl.style.setProperty('--ambilight-img', 'none');
                
                if (isPlaying && settings.autoShow) {
                    showTemporarily(settings.showDuration);
                }
            } else if (isPlaying && settings.autoShow && overlay.classList.contains('hidden')) {
                // Keep showing if playing
            }
            
            if (!settings.autoShow && isPlaying) {
                overlay.classList.remove('hidden');
                overlay.classList.add('visible');
            }

            titleEl.textContent = data.title;
            artistEl.textContent = data.artist || '';

            // Artwork logic
            let newArtHtml = '<div class="placeholder">ЁЯО╡</div>';
            let ambilightUrl = 'none';

            if (data.albumArt) {
                const imgUrl = `data:image/jpeg;base64,${data.albumArt}`;
                newArtHtml = `<img src="${imgUrl}">`;
                ambilightUrl = `url('${imgUrl}')`;
            } else {
                getFallbackArt(data.title, data.artist).then(fallbackUrl => {
                    if (fallbackUrl && trackKey === lastTrack) {
                        artEl.innerHTML = `<img src="${fallbackUrl}">`;
                        artEl.style.setProperty('--ambilight-img', `url('${fallbackUrl}')`);
                    }
                });
            }
            if (data.albumArt || !artEl.innerHTML.includes('<img')) {
                 artEl.innerHTML = newArtHtml;
                 artEl.style.setProperty('--ambilight-img', ambilightUrl);
            }

            if (!settings.autoShow) {
                clearTimeout(hideTimer);
                if (isPlaying) {
                    overlay.classList.remove('hidden');
                    overlay.classList.add('visible');
                } else {
                    overlay.classList.remove('visible');
                    overlay.classList.add('hidden');
                }
            }
        }

        async function update() {
            if (isAnimating) return;
            try {
                const sResp = await fetch('/api/settings');
                const settings = await sResp.json();
                applySettings(settings);

                const resp = await fetch('/api/media');
                const data = await resp.json();

                if (data.title) {
                    const trackKey = data.title + '|' + data.artist;
                    const isPlaying = data.status === 'Playing';
                    
                    if (isPlaying) {
                        overlay.classList.remove('paused');
                    } else {
                        overlay.classList.add('paused');
                    }

                    if (lastTrack === null) {
                        lastTrack = trackKey;
                        if (isPlaying) {
                            if (settings.autoShow) {
                                showTemporarily(settings.showDuration);
                            } else {
                                overlay.classList.remove('hidden');
                                overlay.classList.add('visible');
                            }
                        }
                        applyDomData(data, trackKey, isPlaying, settings, false);
                    } else if (trackKey !== lastTrack) {
                        if (settings.trackChangeAnim !== false && overlay.classList.contains('visible')) {
                            isAnimating = true;
                            overlay.classList.add('track-change');
                            setTimeout(() => {
                                applyDomData(data, trackKey, isPlaying, settings, true);
                                overlay.classList.remove('track-change');
                                isAnimating = false;
                            }, 250);
                            return;
                        } else {
                            applyDomData(data, trackKey, isPlaying, settings, true);
                        }
                    } else {
                        applyDomData(data, trackKey, isPlaying, settings, false);
                    }
                } else {
                    overlay.classList.remove('visible');
                    overlay.classList.add('hidden');
                    lastTrack = null;
                }
            } catch (e) {
                overlay.classList.remove('visible');
                overlay.classList.add('hidden');
            }
        }

        setInterval(update, 300);
        setTimeout(update, 50);
    })();
    </script>
</body>
</html>
